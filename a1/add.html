<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a New Pet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Add a New Pet</h1>
    <form action="/submit-pet" method="POST">
        <label for="pet-name">Pet Name:</label>
        <input type="text" id="pet-name" name="petName" required>

        <label for="pet-type">Type of Pet:</label>
        <input type="text" id="pet-type" name="petType" required>

        <label for="pet-age">Age:</label>
        <input type="number" id="pet-age" name="petAge" required>

        <label for="location">Location:</label>
        <input type="text" id="location" name="location" required>

        <input type="submit" value="Add Pet">
    </form>

</body>

</html>
