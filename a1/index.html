<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Victoria</title>
    <style>
        @font-face {
            font-family: 'ITCGothic';
            src: url('fonts/ITCGOTHIC.OTF') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'ITCGothic', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        header {
            background-color: #108484;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        header img.logo {
            height: 50px;
            width: auto;
        }

        header select,
        header input[type="search"],
        header img.search-icon {
            padding: 5px;
            flex: 0 0 auto;
        }

        .main-content {
            text-align: left;
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
        }

        .main-content img {
            width: 40%;
            border-radius: 50%;
            margin-right: 20px;
        }

        .main-content h1,
        .main-content p {
            font-size: calc(1.5vw + 1em);
            color: #108484;
        }

        footer {
            background-color: #e87c3c;
            padding: 20px 20px;
            text-align: center;
            clear: both;
        }

        @media (max-width: 1920px) {

            header img.logo,
            header img.search-icon {
                height: 30px;
            }

            .main-content h1,
            .main-content p {
                font-size: calc(1.2vw + 1em);
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Pets Victoria Logo" class="logo">
        <select>
            <option>Select an Option...</option>
        </select>
        <input type="search" placeholder="Search">
        <img src="images/search-icon.png" alt="Search Icon" class="search-icon">
    </header>
    <div class="main-content">
        <div>
            <h1>Pets Victoria</h1>
            <p>Welcome to Pet Adoption</p>
        </div>
        <img src="images/main.jpg" alt="Puppy and Kitten">
    </div>
    <footer>
        <p>&copy; Copyright S4092115. All Rights Reserved | Designed for Pets Victoria</p>
    </footer>
</body>

</html>
