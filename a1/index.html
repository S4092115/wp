<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Victoria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffebcd;
        }

        header {
            background-color: #faebd7;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header select,
        header input[type="search"] {
            padding: 5px;
        }

        .main-content {
            text-align: center;
            padding-top: 50px;
        }

        .main-content img {
            width: 40%;
            border-radius: 50%;
        }

        footer {
            background-color: #faebd7;
            padding: 10px 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <select>
            <option>Select an Option...</option>
        </select>
        <input type="search" placeholder="Search">
    </header>
    <div class="main-content">
        <h1>Pets Victoria</h1>
        <p>Welcome to Pet Adoption</p>
        <img src="images/main.jpeg" alt="Puppy and Kitten">
    </div>
    <footer>
        <p>&copy; COPYRIGHT 123456. All Rights Reserved | Designed for Pets Victoria</p>
    </footer>
</body>

</html>
