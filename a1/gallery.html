<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Victoria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #108484;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .header .logo {
            position: absolute;
            left: 20px;
            top: 10px;
        }

        .header .search-bar {
            position: absolute;
            right: 20px;
            top: 10px;
        }

        .header .search-bar input {
            padding: 5px;
            border-radius: 5px;
            border: none;
        }

        .banner {
            padding: 20px;
            text-align: center;
        }

        .banner h1 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }

        .banner p {
            color: #777;
            margin: 10px 0;
        }

        .pets-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
        }

        .pet-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 10px;
            text-align: center;
            width: 200px;
            padding: 20px;
        }

        .pet-card img {
            width: 100%;
            border-radius: 10px;
        }

        .pet-card h2 {
            margin: 10px 0 0 0;
            font-size: 18px;
        }

        footer {
            background-color: #e87c3c;
            padding: 20px 20px;
            text-align: center;
            clear: both;
        }
    </style>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pet Gallery</title>
        <link rel="icon" href="images/favicon.png" type="Pets Favicon">
        <script src="js/main.js" defer></script>
    </head>

<body>
    <header>
        <img src="images/logo.png" alt="Pets Victoria Logo" class="logo">
        <select id="pageSelect">
            <option value="" disabled selected>Select an Option...</option>
            <option value="index.html">Home</option>
            <option value="pets.html">Pets</option>
            <option value="add.html">Add A Pet</option>
            <option value="gallery.html">Gallery</option>
        </select>
        <input type="search" placeholder="Search">
        <img src="images/searchico.png" alt="Search Icon" class="search-icon">
    </header>
    <div class="main-content">
        <div class="text-section">
            <h1>Pet Gallery</h1>
            <div class="pets-container">
                <div class="pet-card">
                    <img src="images/cat1.jpeg" alt="Milo">
                    <h2>Milo</h2>
                </div>
                <div class="pet-card">
                    <img src="images/dog1.jpeg" alt="Baxter">
                    <h2>Baxter</h2>
                </div>
                <div class="pet-card">
                    <img src="images/cat2.jpeg" alt="Luna">
                    <h2>Luna</h2>
                </div>
                <div class="pet-card">
                    <img src="images/dog2.jpeg" alt="Willow">
                    <h2>Willow</h2>
                </div>
                <div class="pet-card">
                    <img src="images/cat3.jpeg" alt="Oliver">
                    <h2>Oliver</h2>
                </div>
                <div class="pet-card">
                    <img src="images/dog3.jpeg" alt="Bella">
                    <h2>Bella</h2>
                </div>
            </div>
        </div>
        <footer>
            <p>&copy; Copyright S4092115. All Rights Reserved | Designed for Pets Victoria</p>
        </footer>
</body>

</html>
