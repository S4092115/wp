<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.png" type="Pets Favicon">
    <script src="js/main.js" defer></script>
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Pets Victoria Logo" class="logo">
        <select id="pageSelect">
            <option value="" disabled selected>Select an Option...</option>
            <option value="index.html">Home</option>
            <option value="pets.html">Pets</option>
            <option value="add.html">Add A Pet</option>
            <option value="gallery.html">Gallery</option>
        </select>
        <input type="search" placeholder="Search">
        <img src="images/searchico.png" alt="Search Icon" class="search-icon">
    </header>
    <div class="main-content">
        <div class="text-section">
            <h1>Pet Gallery</h1>
            <div class="pets-container">
                <div class="pet-card">
                    <img src="images/cat1.jpeg" alt="Milo">
                    <h2>Milo</h2>
                </div>
                <div class="pet-card">
                    <img src="baxter.jpg" alt="Baxter">
                    <h2>Baxter</h2>
                </div>
                <div class="pet-card">
                    <img src="luna.jpg" alt="Luna">
                    <h2>Luna</h2>
                </div>
                <div class="pet-card">
                    <img src="willow.jpg" alt="Willow">
                    <h2>Willow</h2>
                </div>
                <div class="pet-card">
                    <img src="oliver.jpg" alt="Oliver">
                    <h2>Oliver</h2>
                </div>
                <div class="pet-card">
                    <img src="bella.jpg" alt="Bella">
                    <h2>Bella</h2>
                </div>
            </div>
        </div>
        <footer>
            <p>&copy; Copyright S4092115. All Rights Reserved | Designed for Pets Victoria</p>
        </footer>
</body>

</html>
